<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980" role="img" aria-labelledby="title description">
  <title id="title">Architecture API — ETA entre deux adresses et/ou véhicules</title>
  <desc id="description">Flux du endpoint d’ETA hybride GreenLine : authentification, résolution d’adresses par Google Geocoding ou de parcs par Hiboo, calcul de route par Google Routes, puis réponse ETA.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#47645a"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#18845b"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#172a23}
      .title{font-size:34px;font-weight:700}.subtitle{font-size:17px;fill:#587066}
      .label{font-size:15px;font-weight:700;letter-spacing:1px;fill:#557067}
      .node-title{font-size:20px;font-weight:700}.body{font-size:16px;fill:#40584f}.small{font-size:14px;fill:#587066}
      .node{fill:#fff;stroke:#c9d9d1;stroke-width:2}.internal{fill:#f0f7f3;stroke:#8ebaa3;stroke-width:2}.external{fill:#f5f7fb;stroke:#aebbd0;stroke-width:2}.accent{fill:#e7f5ed;stroke:#18845b;stroke-width:2}
      .line{fill:none;stroke:#47645a;stroke-width:3;marker-end:url(#arrow)}.line-green{fill:none;stroke:#18845b;stroke-width:3;marker-end:url(#arrowGreen)}
      .dashed{fill:none;stroke:#718b80;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1680" height="980" fill="#f8fbf9"/>
  <text x="64" y="74" class="title">Calcul d’ETA entre deux emplacements</text>
  <text x="64" y="108" class="subtitle">API GreenLine — une origine et une destination, chacune saisie comme adresse ou numéro de parc</text>

  <rect x="48" y="148" width="1584" height="772" rx="24" fill="#fff" stroke="#d8e4de" stroke-width="2"/>
  <text x="78" y="190" class="label">FLUX DE REQUÊTE</text>

  <!-- Entrée et contrôle d’accès -->
  <rect x="82" y="350" width="250" height="220" rx="18" class="node"/>
  <circle cx="122" cy="394" r="18" fill="#e7f5ed"/>
  <path d="M113 395h18m-9-9v18" stroke="#18845b" stroke-width="3" stroke-linecap="round"/>
  <text x="110" y="444" class="node-title">Client</text>
  <text x="110" y="478" class="body">POST /api/v1/eta/locations</text>
  <text x="110" y="510" class="small">origin + destination</text>
  <text x="110" y="535" class="small">X-API-Token ou Bearer</text>

  <rect x="385" y="350" width="270" height="220" rx="18" class="internal"/>
  <text x="412" y="394" class="node-title">API FastAPI</text>
  <text x="412" y="430" class="body">Valide les emplacements</text>
  <text x="412" y="461" class="body">Vérifie le token client</text>
  <text x="412" y="492" class="body">Applique le quota journalier</text>
  <text x="412" y="535" class="small">Les deux emplacements sont résolus en parallèle</text>
  <path d="M332 460 H385" class="line"/>

  <!-- Résolution par adresse -->
  <rect x="735" y="255" width="225" height="150" rx="18" class="internal"/>
  <text x="760" y="294" class="label">SI ADRESSE</text>
  <text x="760" y="331" class="node-title">Géocodage</text>
  <text x="760" y="365" class="body">Adresse → coordonnées GPS</text>

  <rect x="1030" y="255" width="250" height="150" rx="18" class="external"/>
  <text x="1055" y="294" class="label">GOOGLE CLOUD</text>
  <text x="1055" y="331" class="node-title">Geocoding API</text>
  <text x="1055" y="365" class="body">Clé serveur dédiée</text>

  <!-- Résolution par véhicule -->
  <rect x="735" y="540" width="225" height="180" rx="18" class="internal"/>
  <text x="760" y="579" class="label">SI PARC ID</text>
  <text x="760" y="616" class="node-title">Service Hiboo</text>
  <text x="760" y="650" class="body">Cherche le véhicule</text>
  <text x="760" y="681" class="small">Cache flotte + dernière position</text>

  <rect x="1030" y="540" width="250" height="180" rx="18" class="external"/>
  <text x="1055" y="579" class="label">SERVICE EXTERNE</text>
  <text x="1055" y="616" class="node-title">API Hiboo</text>
  <text x="1055" y="650" class="body">JWT Hiboo</text>
  <text x="1055" y="681" class="small">Position GPS la plus récente</text>

  <!-- Connecteurs de résolution -->
  <path d="M655 405 C690 405 695 330 735 330" class="line"/>
  <path d="M655 510 C690 510 695 630 735 630" class="line"/>
  <path d="M960 330 H1030" class="line"/>
  <path d="M1030 370 H960" class="dashed"/>
  <path d="M960 630 H1030" class="line"/>
  <path d="M1030 675 H960" class="dashed"/>

  <!-- Coordonnées et calcul d'itinéraire -->
  <rect x="1330" y="395" width="250" height="180" rx="18" class="external"/>
  <text x="1355" y="435" class="label">GOOGLE CLOUD</text>
  <text x="1355" y="472" class="node-title">Routes API</text>
  <text x="1355" y="506" class="body">Voiture · trafic</text>
  <text x="1355" y="538" class="small">Durée · distance · polyline</text>
  <path d="M1280 325 C1305 325 1302 440 1330 440" class="line-green"/>
  <path d="M1280 640 C1305 640 1302 530 1330 530" class="line-green"/>

  <!-- Sortie de l'API -->
  <rect x="1330" y="685" width="250" height="155" rx="18" class="accent"/>
  <text x="1355" y="725" class="label">FASTAPI</text>
  <text x="1355" y="762" class="node-title">Construit l’ETA</text>
  <text x="1355" y="795" class="body">ETA UTC + détails du trajet</text>
  <text x="1355" y="820" class="small">et emplacements résolus</text>

  <rect x="1000" y="765" width="280" height="90" rx="16" class="internal"/>
  <text x="1025" y="803" class="node-title">2 emplacements GPS</text>
  <text x="1025" y="832" class="small">origine et destination résolues</text>

  <path d="M1455 575 V685" class="line-green"/>
  <path d="M960 375 C980 375 975 790 1000 790" class="line-green"/>
  <path d="M960 690 C980 690 975 825 1000 825" class="line-green"/>
  <path d="M1280 810 C1310 810 1300 560 1330 525" class="line-green"/>
  <path d="M1330 765 H230 V570" class="line-green"/>

  <!-- Légende concise -->
  <line x1="82" y1="895" x2="132" y2="895" stroke="#47645a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="145" y="901" class="small">Appel ou traitement</text>
  <line x1="315" y1="895" x2="365" y2="895" stroke="#718b80" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="378" y="901" class="small">Retour de données</text>
  <text x="735" y="901" class="small">Google Routes est appelé après résolution des deux emplacements en GPS.</text>
</svg>
