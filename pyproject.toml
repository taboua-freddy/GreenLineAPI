[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenline-eta-api"
version = "0.1.0"
description = "API de gestion de l’ETA des interventions GreenLine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.30,<1.0",
  "google-maps-routing>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/greenline_api"]
artifacts = ["src/greenline_api/static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
