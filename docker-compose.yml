services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://greenline:greenline@db:5432/greenline
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:-}
      API_DAILY_LIMIT_DEFAULT: ${API_DAILY_LIMIT_DEFAULT:-1000}
      GOOGLE_APPLICATION_CREDENTIALS: /run/google/application_default_credentials.json
    volumes:
      - type: bind
        source: ${APPDATA}/gcloud/application_default_credentials.json
        target: /run/google/application_default_credentials.json
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greenline
      POSTGRES_USER: greenline
      POSTGRES_PASSWORD: greenline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenline -d greenline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
