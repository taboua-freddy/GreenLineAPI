services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://greenline:greenline@db:5432/greenline
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greenline
      POSTGRES_USER: greenline
      POSTGRES_PASSWORD: greenline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenline -d greenline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
